name: ci
on: [push, pull_request]
jobs:
  python-reference:            # executable specification, AI services, automation, data processing
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: actions/setup-python@v7, with: {python-version: "3.12"}}, {run: pip install cryptography fonttools brotli}, {run: python -m unittest discover -s tests -t .}, {run: python contract/tools/validate_contract.py}]
  typescript:                  # web, PWA, dashboards, Node.js services
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: actions/setup-node@v7, with: {node-version: "22"}}, {run: cd ts && npm install && npx tsc -p tsconfig.ci.json && node --test "dist/test/*.test.js"}, {name: interface emulators are built from the current code, run: TSC=ts/node_modules/.bin/tsc node web/build.mjs --check}]
  rust:                        # offline engine: native, JNI, static library, WebAssembly
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: dtolnay/rust-toolchain@stable, with: {targets: wasm32-unknown-unknown}}, {run: cd rust/lynk-offline && cargo test}, {run: cd rust/lynk-offline && cargo build --target wasm32-unknown-unknown}]
  kotlin:
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: actions/setup-java@v6, with: {distribution: temurin, java-version: "21"}}, {run: cd android && gradle :core:test}]
  swift:                       # LynkCore is plain Swift + Foundation, so it is tested on Linux (macOS runners kept getting cancelled in the queue); the macOS run is ios-macos.yml
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {run: swift --version && cd ios && swift test}]
  postgres-schema:             # the PostgreSQL schema has never run in the build sandbox, so CI must prove it
    runs-on: ubuntu-24.04
    services: {postgres: {image: "postgres:16", env: {POSTGRES_PASSWORD: ci}, ports: ["5432:5432"], options: --health-cmd pg_isready}}
    steps: [{uses: actions/checkout@v5}, {run: PGPASSWORD=ci psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f sql/schema.postgres.sql}]
  names-and-secrets:
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {run: "! grep -rInF --exclude-dir=.git --exclude=naming.py --exclude=test_foundations.py --exclude=ci.yml --exclude=footer.test.ts -e LynkAI -e LynkDocs -e support.lynkomni.com -e docs.lynkomni.com ."}]
  visuals:                     # illustrations, charts, store and web images: every need has files, nothing off-brand or placeholder
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: actions/setup-python@v7, with: {python-version: "3.12"}}, {run: python visuals/check.py}, {run: python -m unittest tests.test_visuals}]
  layout:                      # translations never break a screen (long-text and right-to-left, desktop and phone), the automatic accessibility check and the speed budget
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: actions/setup-python@v7, with: {python-version: "3.12"}}, {run: sudo apt-get update -q && sudo apt-get install -y fonts-noto-core fonts-noto-cjk && pip install playwright && python -m playwright install --with-deps chromium}, {run: python -m unittest tests.test_layout_i18n tests.test_speed_budget}]
  providers:                   # provider ledger: every placeholder registered, no service on without its provider
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: actions/setup-python@v7, with: {python-version: "3.12"}}, {run: python providers/check.py}, {run: python -m unittest tests.test_providers tests.test_merchant_logo}]
  brand:                       # logos and icons: vendored copy must match its lock and the design tokens
    runs-on: ubuntu-24.04
    steps: [{uses: actions/checkout@v5}, {uses: actions/setup-python@v7, with: {python-version: "3.12"}}, {run: pip install fonttools brotli}, {run: python brand/check.py}, {run: python design/check_fonts.py}, {run: python -m unittest tests.test_brand tests.test_fonts}]
