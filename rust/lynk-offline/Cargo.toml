[package]
name = "lynk-offline"
version = "0.1.0"
edition = "2021"
description = "LynkOmni offline engine core: identifiers, event hash chain, session policy. Shared by Android (JNI), iOS (static library) and the PWA (WebAssembly)."

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
