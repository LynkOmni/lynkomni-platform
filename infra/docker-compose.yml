# Local and staging stack: PostgreSQL, S3-compatible object storage, the API, and metrics. Untested in the build sandbox.
services:
  postgres: {image: "postgres:16", environment: {POSTGRES_PASSWORD: "${PG_PASSWORD}"}, volumes: ["pgdata:/var/lib/postgresql/data", "../sql/schema.postgres.sql:/docker-entrypoint-initdb.d/001.sql:ro"]}
  objects:  {image: "minio/minio", command: "server /data", environment: {MINIO_ROOT_USER: "${OBJ_USER}", MINIO_ROOT_PASSWORD: "${OBJ_PASSWORD}"}, volumes: ["objdata:/data"]}
  api:      {build: {context: "..", dockerfile: infra/Dockerfile.api}, depends_on: [postgres, objects], environment: {DATABASE_URL: "postgres://postgres:${PG_PASSWORD}@postgres/postgres"}}
  metrics:  {image: "prom/prometheus", volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]}
volumes: {pgdata: {}, objdata: {}}
