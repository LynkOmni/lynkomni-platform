/* Shared by every real-device emulator: page head, stage, control panel, event log, the five state chips. Colours are design tokens only. */

@media (max-width: 860px) { .stage { grid-template-columns: minmax(0, 1fr); } }

.st-queued { background: var(--status-neutral-bg); color: var(--status-neutral-text); border-color: var(--status-neutral-border); }
.st-sent, .st-accepted { background: var(--status-info-bg); color: var(--status-info-text); border-color: var(--status-info-border); }
.st-confirmed { background: var(--status-success-bg); color: var(--status-success-text); border-color: var(--status-success-border); }
.st-failed { background: var(--status-danger-bg); color: var(--status-danger-text); border-color: var(--status-danger-border); }
.panel { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 16px; font-size: 14px; }
.panel h2 { margin: 0 0 10px; font-size: 16px; }

.panel input[type="checkbox"] { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--brand-primary); flex: none; }
.panel select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border-input); background: var(--bg-surface); color: var(--text-primary); min-height: 36px; }
.panel .help { color: var(--text-secondary); font-size: 13px; margin: 4px 0; }

.log { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; font-size: 12px; }

.log code { font: 600 12px var(--font-mono); }

.log details { width: 100%; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.mainfoot { margin-block-start: 32px; padding: 24px 16px; border-block-start: 1px solid var(--border-subtle); background: var(--bg-surface); color: var(--text-primary); font: 14px/1.5 var(--font-body); }

<header class="pagehead">
  <h1>LynkStock handheld scanner <span class="draft">Draft design</span></h1>
  <p>Interactive emulator of a rugged handheld stock scanner: scan to count, receive a supplier delivery, move stock and see low and negative stock, all offline. Sample data, sandbox partners, test money only. Not reviewed by a designer yet.</p>
