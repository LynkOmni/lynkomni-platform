class EventLog {
    onChange;
    events = [];
    constructor(onChange) {

        this.events.unshift(e);

    }
    /** Queued items go out when a link exists (a weak link now and then); sent items are accepted by the cloud after a moment. */
    tick(maySend, weak, tickNo, onAccepted) {

            return false;
        const now = Date.now();
        let changed = false;
        for (const e of [...this.events].reverse()) {
            if (e.sync === "queued") {
                e.sync = "sent";
                e.at = now;
                changed = true;
            }
            else if (e.sync === "sent" && now - e.at > 700) {
                e.sync = "accepted";
                changed = true;
                onAccepted(e);
            }
        }
        if (changed)
            this.onChange();
        return changed;
    }
    pending() {
        const waiting = this.events.filter((e) => e.sync === "queued" || e.sync === "sent");
        return { count: waiting.length, state: waiting.some((e) => e.sync === "queued") ? "queued" : waiting.length ? "sent" : "accepted" };
    }
    html(esc_, chip, empty) {
        return this.events.slice(0, 40).map((e) => `<li><span class="n">#${e.n}</span><code>${esc_(e.type)}</code><span class="org">${e.origin}</span>${chip(e.sync)}</li>`).join("") || `<li class="empty">${esc_(empty)}</li>`;

}

function panelHtml(controls, st, words, country, extra = {}) {

    const parts = [`<h2>${esc(t("try_it"))}</h2><p class="help">${esc(extra.help ?? t("sandbox_note"))}</p><h3>${esc(t("conditions"))}</h3>`];

            parts.push(box("online", st.online, t("internet"), t("internet_help")));
        if (c === "fail")
            parts.push(box("fail", st.fail, t("provider_declines"), t("provider_declines_help")));
        if (c === "type")
            parts.push(sel("type", t("business_type"), (extra.types ?? []).map((x) => `<option value="${esc(x)}" ${x === st.type ? "selected" : ""}>${esc(t(`type_${x}`))}</option>`).join("")));
        if (c === "plan")

        if (c === "country")

        if (c === "real")

/** Reads a panel change into the state; returns true when the screen words must be redrawn (language). */
