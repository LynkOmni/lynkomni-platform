.dsh-panel .command-bar, .dsh-panel .help-panel, .dsh-panel .account-menu, .dsh-panel .sheet { display: flex; flex-direction: column; gap: 8px; }
.dsh-panel .cmd-input { display: flex; align-items: center; gap: 6px; padding-inline-end: 40px; }
.dsh-panel .cmd-input input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border-input); background: var(--bg-base); color: var(--text-primary); font: 15px var(--font-body); }
.dsh-panel .hbtn, .dsh-panel .copy { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.dsh-panel .results li button, .dsh-panel .articles a, .dsh-panel .mitem { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: inherit; font: inherit; text-align: start; cursor: pointer; text-decoration: none; flex-wrap: wrap; }
.dsh-panel .results li button:hover, .dsh-panel .articles a:hover, .dsh-panel .mitem:hover { background: var(--bg-subtle); }
.dsh-panel .rt { font-weight: 600; flex: 1 1 8em; min-width: 0; }
.dsh-panel .rs, .dsh-panel .rk, .dsh-panel .kbd, .dsh-panel .suggested { color: var(--text-secondary); font-size: 12px; }
.dsh-panel .rk { margin-inline-start: auto; }
.dsh-panel .none { color: var(--text-secondary); padding: 8px; }
.dsh-panel .assist-hand, .dsh-panel .help-steps button, .dsh-secondary, .dsh-primary, .dsh-panel .sheet .primary, .dsh-panel .sheet .secondary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 6px 12px; border-radius: 12px; font: 600 15px var(--font-body); cursor: pointer; flex-wrap: wrap; text-align: center; }
.dsh-primary, .dsh-panel .sheet .primary { border: 0; background: var(--brand-primary); color: var(--on-brand); }
.dsh-secondary, .dsh-panel .assist-hand, .dsh-panel .help-steps button, .dsh-panel .sheet .secondary { border: 1px solid var(--border-subtle); background: var(--bg-base); color: var(--text-primary); }
.dsh-panel .help-steps { display: flex; flex-direction: column; gap: 6px; }
.dsh-panel .who { display: flex; gap: 10px; align-items: center; }
.dsh-panel .who > div { min-width: 0; }
.dsh-panel .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-subtle); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.dsh-panel .avatar .ic, .dsh-panel .avatar svg { width: 22px; height: 22px; display: inline-flex; }
.dsh-panel .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dsh-panel .who > div { min-width: 0; overflow-wrap: anywhere; }
.dsh-panel .lynkid { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.dsh-panel .mlabel { display: block; color: var(--text-secondary); font-size: 12px; padding: 4px 8px 0; }
.dsh-panel .mitem.current { color: var(--brand-ink); font-weight: 700; }
.dsh-panel .mitem.danger { color: var(--status-danger-text); }
.dsh-panel dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 8px 0; }
.dsh-panel dt { color: var(--text-secondary); }
.dsh-panel dd { margin: 0; font-weight: 600; }
.dsh-panel .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; min-width: 0; padding: 0; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; }   /* never inherit a device's own .switch button look */
.dsh-panel .switch input { width: 44px; height: 24px; flex: none; }
.dsh-note, .dsh-panel .note { color: var(--text-secondary); font-size: 13px; margin: 6px 0 0; }
.dsh-link { min-height: 44px; border: 0; background: transparent; color: var(--brand-ink); font: 600 14px var(--font-body); text-decoration: underline; cursor: pointer; width: 100%; }
.dsh-locale { display: flex; flex-direction: column; gap: 8px; }
.dsh-state .state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; text-align: center; }
.dsh-state .state .pic { display: block; width: min(150px, 55%); }
.dsh-state .state .pic svg { width: 100%; height: auto; }
.dsh-state .state h2 { margin: 0; font: 700 16px/1.3 var(--font-heading); overflow-wrap: anywhere; }
.dsh-state .state p { margin: 0; color: var(--text-secondary); font-size: 13px; overflow-wrap: anywhere; }
.dsh-state .state .primary { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--brand-primary); color: var(--on-brand); font: 600 14px var(--font-body); cursor: pointer; }
.dsh-state .skel { background: var(--bg-subtle); border-radius: 8px; height: 14px; margin: 6px 0; }
.lite .dsh-state .pic, .dsh-lite .dsh-state .pic { display: none; }
#screen { position: relative; }
.pagehead .address { margin: 6px 0 0; font-size: 13px; } .pagehead .address code { font-weight: 600; overflow-wrap: anywhere; }

/* picture mode (S4, 43 G): bigger pictures, the word always beside them, bigger targets */
.dsh-toggle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 8px; padding: 0 12px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-surface); color: inherit; font: 600 14px var(--font-body); cursor: pointer; text-align: start; }
.dsh-toggle > span:not(.ic):not(.dsh-sw) { flex: 1; }
.dsh-toggle .ic { width: 22px; height: 22px; display: inline-flex; flex: none; }
.dsh-sw { width: 36px; height: 20px; border-radius: 10px; background: var(--border-strong); position: relative; flex: none; }
.dsh-sw::after { content: ""; position: absolute; inset-block-start: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-surface); }
.dsh-toggle[aria-checked="true"] .dsh-sw { background: var(--brand-primary); }
.dsh-toggle[aria-checked="true"] .dsh-sw::after { inset-inline-start: 18px; }
.lowlit { font-size: 112%; }
.lowlit button { min-height: 52px; }
.lowlit button .ic, .lowlit button .ic svg { width: 30px; height: 30px; }

/* LynkStock scanner: an original rugged handheld with a trigger. Every colour is a design token. */
.gun { width: 300px; position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
.window { width: 120px; height: 14px; border-radius: 7px 7px 0 0; background: var(--device-glass); transition: box-shadow .1s; }
.window.on { box-shadow: 0 -10px 24px var(--device-key-cancel); }
.gbody { width: 300px; padding: 18px 16px 20px; border-radius: 26px 26px 34px 34px; background: linear-gradient(160deg, var(--device-key-clear), var(--device-shell) 22%, var(--device-glass)); box-shadow: 0 24px 50px -20px color-mix(in srgb, var(--device-glass) 60%, transparent); }
.sscreen { height: 360px; border-radius: 10px; background: var(--bg-base); color: var(--text-primary); overflow: hidden; display: flex; flex-direction: column; font: 13px var(--font-body); }
.sscreen.dark { color-scheme: dark; }
.shead { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); font-weight: 700; }
.shead .off { color: var(--status-warning-text); }
.ic { display: inline-block; width: 14px; height: 14px; vertical-align: middle; }
.ic svg { width: 100%; height: 100%; display: block; }
.smodes { display: flex; border-bottom: 1px solid var(--border-subtle); }
.smodes button { flex: 1; min-height: 32px; border: 0; background: transparent; color: var(--text-secondary); font: 600 11px var(--font-body); cursor: pointer; overflow-wrap: anywhere; }
.smodes button[aria-current] { color: var(--brand-ink); box-shadow: inset 0 -2px 0 var(--brand-primary); }
.sbody { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.sbody h2 { margin: 0; font-size: 16px; }
.sbody p { margin: 0; }
.big .ic { width: 48px; height: 48px; display: block; margin: 8px auto 0; color: var(--text-secondary); }
.sbody > p:nth-child(2) { text-align: center; color: var(--text-secondary); }
.ok { text-align: center; color: var(--status-success-text); font-weight: 600; }
.code { font-family: var(--font-mono); color: var(--text-secondary); }
em { font-style: normal; font-weight: 700; color: var(--status-warning-text); }
.slist { list-style: none; margin: 4px 0 0; padding: 0; }
.slist li { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border-subtle); }
.slist li span:first-child { flex: 1; overflow-wrap: anywhere; }
.slist em { width: 100%; font-size: 11px; }
.qty { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 8px 0; }
.qty button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; padding: 12px; }
.qty output { font: 700 28px var(--font-heading); min-width: 50px; text-align: center; }
.save { min-height: 44px; border: 0; border-radius: 10px; background: var(--brand-primary); color: var(--on-brand); font: 700 14px var(--font-body); cursor: pointer; }
.skeys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.skeys button { height: 40px; border: 0; border-radius: 10px; background: var(--device-key); color: var(--on-device-key); font: 700 13px var(--font-body); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.skeys button:last-child { background: var(--device-key-enter); color: var(--on-device-key-enter); }
.skeys .ic { width: 18px; height: 18px; }
.trigger { margin-top: -8px; width: 110px; height: 120px; border: 0; border-radius: 0 0 40px 40px; background: linear-gradient(180deg, var(--device-shell), var(--device-glass)); color: var(--device-key-clear); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.trigger .ic { width: 36px; height: 36px; }
.gun > .mark { position: absolute; bottom: 20px; width: 14px; color: var(--on-device-key); opacity: .6; }
.mark svg { width: 100%; height: auto; display: block; }
.shead { flex-wrap: wrap; gap: 4px; }
</style>

    stateButtons($("#stateButtons"), ["list", "count", "receive", "adjust"], (k) => { if (k === "list")
        S.cur = "";
    else {
        S.mode = k;
        S.cur = ITEMS[3].id;
        S.qty = 1;
    } draw(); });
}
function main() {
    S.country = DATA.packOrder[0] ?? "";
    panel();
    draw();
    document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (!b)
        return; if (b.classList.contains("dsh-scrim") && e.target.closest("[data-stop]"))
        return; if (!DSH.act(b.dataset["act"] ?? ""))
        act(b.dataset["act"] ?? ""); });
    document.addEventListener("input", (e) => { DSH.input(e.target); });
    document.addEventListener("keydown", (e) => { DSH.key(e); });
    window.__settle = () => { DSH.settle(); draw(); };
    $("#trigger").addEventListener("click", scan);
    $("#panel").addEventListener("change", (e) => { if (panelChange(e.target, S, DATA))
        panel(); draw(); });
    window.setInterval(() => { S.ticks += 1; LOG.tick(S.online, false, S.ticks, () => undefined); }, 400);
    fitToWidth($("#rig"), Number($("#rig").dataset["width"]) || 420);
}
main();

})();
document.documentElement.dataset.ready = "1"; window.__readyAt = performance.now();
})();</script>
