/* The tagline sits close under the logo and a clear gap above the columns. Scoped to .mainfoot so a page's own paragraph reset (the shell's .shell p) never wipes it (owner, 19 November 2026). */
.mainfoot .ftag { margin: 4px 0 24px; color: var(--text-secondary); }
.fcols, .frow { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(160px, 100%), 1fr)); gap: 16px 24px; }
.fcols { grid-auto-flow: row dense; }
/* A long list takes as many tracks as its span and flows into balanced sub-columns (footer.ts PER_COLUMN); on a narrow footer it
   takes the full width and its sub-columns are as many as fit, so nothing is ever cut off or left empty. */
.fcol[data-span="2"] { grid-column: span 2; } .fcol[data-span="3"] { grid-column: span 3; }
.fcol ul { columns: var(--span, 1) 150px; column-gap: 24px; }
.fcol li { break-inside: avoid; }
@container (max-width: 560px) { .fcol[data-span="2"], .fcol[data-span="3"] { grid-column: 1 / -1; } }
@container (max-width: 380px) { .fcols, .frow { grid-template-columns: 1fr; } }
/* A product's short name with its plain word beside it: "LynkAcc (Accounting)". */
.mainfoot a .fname { font-weight: 600; }
.mainfoot a .fplain { color: var(--text-secondary); font-weight: 400; }
.frow { margin-block-start: 24px; }
.fcol { min-width: 0; }
.fpays li { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.fpays .ic { inline-size: 20px; block-size: 20px; flex: none; }
.fnews { min-width: 0; grid-column: span 2; }
.mainfoot .fnews p { margin: 0 0 8px; color: var(--text-secondary); overflow-wrap: anywhere; }
.fnews .fl { display: flex; flex-direction: column; gap: 4px; margin-block-end: 8px; }
.fnews input[type="email"] { font: inherit; min-height: 44px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-input); background: var(--bg-surface); color: var(--text-primary); }
.fnews fieldset { border: 0; padding: 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.fnews legend { padding: 0; margin-block-end: 4px; font-weight: 600; }
.ftopic, .fconsent { display: flex; align-items: center; gap: 8px; min-height: 44px; overflow-wrap: anywhere; }
.ftopic input, .fconsent input { inline-size: 20px; block-size: 20px; flex: none; accent-color: var(--brand-primary); }
.fnews button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: var(--brand-primary); color: var(--on-brand); font: 600 14px var(--font-body); cursor: pointer; }
.fnote { font-size: 13px; }
.flegal { margin-block-start: 24px; padding-block-start: 16px; border-block-start: 1px solid var(--border-subtle); display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
.flegal ul { display: flex; flex-wrap: wrap; gap: 0 16px; }
.mainfoot .fcopy { margin: 0; color: var(--text-secondary); font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 600px) { .fnews { grid-column: auto; } }
/* Short footer inside apps: one line, the fixed copyright text. */
.shortfoot { padding: 12px 8px; text-align: center; }
.shortfoot p { margin: 0; color: var(--text-secondary); font-size: 11px; overflow-wrap: anywhere; }
/* A very narrow footer (a watch, 41 B): one column, and the newsletter takes the full width instead of spanning two tracks. */
@container (max-width: 380px) { .frow .fnews { grid-column: 1 / -1; } }

/* The shell parts inside device apps (ts/src/deviceshell.ts, blueprint 41 B): search, help, account, connection chip, the
   first-run language card and the sheets. Logical properties only, so right-to-left mirrors; every target is 44 px. */
.dsh-bar { display: inline-flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 2px 4px; flex: none; max-width: 100%; }
.dsh-btn { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; padding: 0; }
.dsh-btn .ic { width: 22px; height: 22px; display: inline-flex; }
.dsh-btn .ic svg, .dsh-x .ic svg { width: 100%; height: 100%; }
.dsh-btn:focus-visible, .dsh-panel button:focus-visible, .dsh-panel a:focus-visible, .dsh-field:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.dsh-chip, .dsh-bar .netchip { min-height: 44px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--border-subtle); background: var(--bg-surface); color: var(--text-primary); font: 600 12px var(--font-body); cursor: pointer; }
.dsh-bar .netchip .ic { width: 16px; height: 16px; display: inline-flex; }
.dsh-bar .netchip.offline, .dsh-bar .netchip.forced { color: var(--status-warning-text); background: var(--status-warning-bg); border-color: var(--status-warning-border); }
.dsh-bar .netchip .badge { min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--status-info-bg); color: var(--status-info-text); }
.dsh-field { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--border-input); background: var(--bg-surface); color: var(--text-secondary); font: 14px var(--font-body); cursor: pointer; text-align: start; }
.dsh-field .ic { width: 18px; height: 18px; display: inline-flex; flex: none; }
.dsh-field span { overflow-wrap: anywhere; }
.dsh-scrim { position: absolute; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; background: color-mix(in srgb, var(--text-primary) 40%, transparent); }
.dsh-panel { position: relative; width: min(100%, 520px); max-height: 92%; overflow-y: auto; padding: 16px; border-radius: 18px 18px 0 0; background: var(--bg-surface); color: var(--text-primary); font: 14px/1.4 var(--font-body); box-sizing: border-box; }
/* a phone slides the sheet up from the bottom; a wider screen (tablet, computer) shows a dialog in the middle with
   every corner rounded (owner report 2026-11-19: on the laptop the card looked cut off at the bottom) */
/* (device class from the screen root, never the browser; a container query here broke tapping inside a scaled screen) */
[data-device-class]:not([data-device-class="phone"]):not([data-device-class="watch"]) .dsh-scrim { align-items: center; padding: 24px; }
[data-device-class]:not([data-device-class="phone"]):not([data-device-class="watch"]) .dsh-panel { align-self: center; max-height: 100%; border-radius: 18px; box-shadow: 0 16px 40px -16px color-mix(in srgb, var(--text-primary) 45%, transparent); }
.dsh-panel h2 { margin: 0 0 8px; padding-inline-end: 44px; font: 700 17px/1.3 var(--font-heading); overflow-wrap: anywhere; }
.dsh-panel p, .dsh-panel span, .dsh-panel dd, .dsh-panel dt, .dsh-panel a, .dsh-panel button, .dsh-panel code { overflow-wrap: anywhere; }
.dsh-x { position: absolute; inset-block-start: 8px; inset-inline-end: 8px; min-width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.dsh-x .ic { width: 20px; height: 20px; display: inline-flex; }
.dsh-panel .ic { width: 18px; height: 18px; display: inline-flex; flex: none; }
.dsh-panel .ic svg { width: 100%; height: 100%; }
.dsh-panel ul { list-style: none; margin: 0; padding: 0; }
.dsh-panel .command-bar, .dsh-panel .help-panel, .dsh-panel .account-menu, .dsh-panel .sheet { display: flex; flex-direction: column; gap: 8px; }
.dsh-panel .cmd-input { display: flex; align-items: center; gap: 6px; padding-inline-end: 40px; }
.dsh-panel .cmd-input input { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border-input); background: var(--bg-base); color: var(--text-primary); font: 15px var(--font-body); }
.dsh-panel .hbtn, .dsh-panel .copy { min-width: 44px; min-height: 44px; border: 0; background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.dsh-panel .results li button, .dsh-panel .articles a, .dsh-panel .mitem { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 6px 8px; border: 0; border-radius: 10px; background: transparent; color: inherit; font: inherit; text-align: start; cursor: pointer; text-decoration: none; flex-wrap: wrap; }
.dsh-panel .results li button:hover, .dsh-panel .articles a:hover, .dsh-panel .mitem:hover { background: var(--bg-subtle); }
.dsh-panel :is(.results li button, .articles a, .mitem):hover :is(.rs, .rk, .kbd, .suggested) { color: var(--text-primary); }   /* secondary text is too faint on the hover colour */
.dsh-panel .rt { font-weight: 600; flex: 1 1 8em; min-width: 0; }
.dsh-panel .rs, .dsh-panel .rk, .dsh-panel .kbd, .dsh-panel .suggested { color: var(--text-secondary); font-size: 12px; }
.dsh-panel .rk { margin-inline-start: auto; }
.dsh-panel .none { color: var(--text-secondary); padding: 8px; }
.dsh-panel .assist-hand, .dsh-panel .help-steps button, .dsh-secondary, .dsh-primary, .dsh-panel .sheet .primary, .dsh-panel .sheet .secondary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; padding: 6px 12px; border-radius: 12px; font: 600 15px var(--font-body); cursor: pointer; flex-wrap: wrap; text-align: center; }
.dsh-primary, .dsh-panel .sheet .primary { border: 0; background: var(--brand-primary); color: var(--on-brand); }
.dsh-secondary, .dsh-panel .assist-hand, .dsh-panel .help-steps button, .dsh-panel .sheet .secondary { border: 1px solid var(--border-subtle); background: var(--bg-base); color: var(--text-primary); }
.dsh-panel .help-steps { display: flex; flex-direction: column; gap: 6px; }
.dsh-panel .who { display: flex; gap: 10px; align-items: center; }
.dsh-panel .who > div { min-width: 0; }
.dsh-panel .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-subtle); color: var(--brand-ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.dsh-panel .avatar .ic, .dsh-panel .avatar svg { width: 22px; height: 22px; display: inline-flex; }
.dsh-panel .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.dsh-panel .who > div { min-width: 0; overflow-wrap: anywhere; }
.dsh-panel .lynkid { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.dsh-panel .mlabel { display: block; color: var(--text-secondary); font-size: 12px; padding: 4px 8px 0; }
.dsh-panel .mitem.current { color: var(--brand-ink); font-weight: 700; }
.dsh-panel .mitem.danger { color: var(--status-danger-text); }
.dsh-panel dl { display: grid; grid-template-columns: minmax(0, max-content) minmax(0, 1fr); gap: 6px 12px; margin: 8px 0; }
.dsh-panel dt { color: var(--text-secondary); }
.dsh-panel dd { margin: 0; font-weight: 600; }
.dsh-panel .switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; min-width: 0; padding: 0; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; }   /* never inherit a device's own .switch button look */
.dsh-panel .switch input { width: 44px; height: 24px; flex: none; }
.dsh-note, .dsh-panel .note { color: var(--text-secondary); font-size: 13px; margin: 6px 0 0; }
.dsh-link { min-height: 44px; border: 0; background: transparent; color: var(--brand-ink); font: 600 14px var(--font-body); text-decoration: underline; cursor: pointer; width: 100%; }
.dsh-locale { display: flex; flex-direction: column; gap: 8px; }
.dsh-state .state { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 12px; text-align: center; }
.dsh-state .state .pic { display: block; width: min(150px, 55%); }
.dsh-state .state .pic svg { width: 100%; height: auto; }
.dsh-state .state h2 { margin: 0; font: 700 16px/1.3 var(--font-heading); overflow-wrap: anywhere; }
.dsh-state .state p { margin: 0; color: var(--text-secondary); font-size: 13px; overflow-wrap: anywhere; }
.dsh-state .state .primary { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--brand-primary); color: var(--on-brand); font: 600 14px var(--font-body); cursor: pointer; }
.dsh-state .skel { background: var(--bg-subtle); border-radius: 8px; height: 14px; margin: 6px 0; }
.lite .dsh-state .pic, .dsh-lite .dsh-state .pic { display: none; }
#screen { position: relative; }
.pagehead .address { margin: 6px 0 0; font-size: 13px; } .pagehead .address code { font-weight: 600; overflow-wrap: anywhere; }

/* picture mode (S4, 43 G): bigger pictures, the word always beside them, bigger targets */
.dsh-toggle { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; margin-top: 8px; padding: 0 12px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-surface); color: inherit; font: 600 14px var(--font-body); cursor: pointer; text-align: start; }
.dsh-toggle > span:not(.ic):not(.dsh-sw) { flex: 1; }
.dsh-toggle .ic { width: 22px; height: 22px; display: inline-flex; flex: none; }
.dsh-sw { width: 36px; height: 20px; border-radius: 10px; background: var(--border-strong); position: relative; flex: none; }
.dsh-sw::after { content: ""; position: absolute; inset-block-start: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg-surface); }
.dsh-toggle[aria-checked="true"] .dsh-sw { background: var(--brand-primary); }
.dsh-toggle[aria-checked="true"] .dsh-sw::after { inset-inline-start: 18px; }
.lowlit { font-size: 112%; }
.lowlit button { min-height: 52px; }
.lowlit button .ic, .lowlit button .ic svg { width: 30px; height: 30px; }

/* Non-touch versions (DEVICE 48.17.14): the screen takes no taps; the device's own keys move a thick, always-visible focus ring. */
[data-touch="no"] { touch-action: none; }
[data-touch="no"] * { pointer-events: none; }
[data-touch="no"] :focus { outline: 4px solid var(--focus-ring); outline-offset: 2px; }
.navpad { display: grid; grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); gap: 6px; justify-content: center; margin: 12px auto 0; direction: ltr; }
.padkey { min-width: 48px; min-height: 48px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--device-key); color: var(--on-device-key); font: 600 16px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.padkey .ic { width: 20px; height: 20px; }
.padkey:focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 2px; }
.padkey.up { grid-column: 2; grid-row: 1; } .padkey.left { grid-column: 1; grid-row: 2; } .padkey.ok { grid-column: 2; grid-row: 2; background: var(--device-key-enter); color: var(--on-device-key-enter); }
.padkey.right { grid-column: 3; grid-row: 2; } .padkey.down { grid-column: 2; grid-row: 3; } .padkey.back { grid-column: 3; grid-row: 3; background: var(--device-key-cancel); color: var(--on-device-key-cancel); }

/* The MASTER UPDATE parts (sections 1 and 3): PIN pad and number matching, the bell, banners, message parts, LynkAssist and
   breadcrumbs. Shared by the shell pages and every Business app device; built in when a page bundles ts/src/notify.js. Tokens only. */
/* ---- MASTER UPDATE, build section 1: sign-in parts, the bell, message parts, LynkAssist and breadcrumbs (tokens only) ---- */
.pinpad, .nmatch { display: grid; gap: 10px; justify-items: center; max-inline-size: 320px; min-inline-size: 0; margin-inline: auto; overflow-wrap: anywhere; }
.ptitle { margin: 0; font-weight: 700; text-align: center; }
.pdots-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; min-block-size: 18px; max-inline-size: 100%; }
.pdot { inline-size: 14px; block-size: 14px; border-radius: 50%; border: 2px solid var(--border-strong); }
.pdot.on { background: var(--text-primary); border-color: var(--text-primary); }
.pkeys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; inline-size: 100%; }
.pkey { display: grid; justify-items: center; align-content: center; gap: 2px; min-block-size: 60px; border: 1px solid var(--border-subtle); border-radius: 14px; background: var(--bg-subtle); color: var(--text-primary); font: 700 var(--text-20)/1 var(--font-body); font-feature-settings: var(--font-feature-tabular); }
.pkey:not(:disabled):hover { border-color: var(--brand-primary); }
.pkey:disabled { opacity: .45; }
.pkey.fn { background: var(--bg-surface); color: var(--brand-ink); }
.pkey .pdots { inline-size: 18px; block-size: 18px; color: var(--text-secondary); }
.pmsg { display: flex; gap: 6px; align-items: center; margin: 0; font-size: var(--text-14); text-align: center; }
.pmsg.danger { color: var(--status-danger-text); } .pmsg.warning { color: var(--status-warning-text); } .pmsg.success { color: var(--status-success-text); }
.popts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.chipbtn.on { background: var(--brand-subtle); border-color: var(--brand-primary); }
.nbig { margin: 0; font: 800 var(--text-24)/1 var(--font-heading); font-size: clamp(var(--text-24), 12vw, 48px); letter-spacing: .08em; font-feature-settings: var(--font-feature-tabular); }
.nchoices { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-inline-size: 100%; }
.nchoice { min-inline-size: 56px; max-inline-size: 100%; min-block-size: 64px; border: 2px solid var(--border-strong); border-radius: 14px; background: var(--bg-surface); color: var(--text-primary); font: 800 var(--text-24)/1 var(--font-heading); }
.nhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.nhead h2 { margin: 0; }
.nfilters { display: flex; gap: 6px; flex-wrap: wrap; margin-block: 8px; }
.nsec { margin: 12px 0 4px; font-size: var(--text-12); color: var(--text-secondary); text-transform: none; }
.nline { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px; border-radius: 12px; }
.nline.unread { background: var(--brand-subtle); }
.nline.p-critical { border-inline-start: 4px solid var(--status-danger-border); }
.nline.p-high { border-inline-start: 4px solid var(--status-warning-border); }
.nline .ntext a { display: grid; gap: 2px; color: var(--text-primary); }
.nline .nt { font-weight: 600; overflow-wrap: anywhere; } .nline .nb { color: var(--text-secondary); font-size: var(--text-12); }
.ncount { justify-self: start; padding: 0 8px; border-radius: 999px; background: var(--bg-subtle); color: var(--text-secondary); font-size: var(--text-12); font-weight: 700; }
.nmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--text-secondary); font-size: var(--text-12); }
.nprio { font-weight: 700; color: var(--text-primary); }
.nacts { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 6px; }
.ndone { display: flex; gap: 6px; align-items: center; margin: 6px 0 0; color: var(--status-success-text); font-size: var(--text-12); }
.nmenu { display: flex; flex-direction: column; gap: 2px; }
.nempty { display: grid; justify-items: center; gap: 6px; padding: 24px 8px; color: var(--text-secondary); text-align: center; }
.primary.small { min-block-size: var(--touch-target); padding: 0 12px; margin-block-start: 6px; font-size: var(--text-12); }
.nbanner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--status-warning-border); background: var(--status-warning-bg); color: var(--status-warning-text); }
.nbanner.p-critical { border-color: var(--status-danger-border); background: var(--status-danger-bg); color: var(--status-danger-text); }
.nbanner .nt { flex: 1; font-weight: 700; overflow-wrap: anywhere; }
.banners { position: absolute; inset-block-start: 64px; inset-inline: 12px; display: grid; gap: 8px; z-index: 30; max-inline-size: 560px; margin-inline: auto; }
.mail { border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; background: var(--bg-surface); }
.mail .mhead { padding-block-end: 8px; border-block-end: 1px solid var(--border-subtle); margin-block-end: 8px; color: var(--text-primary); }
.mail .mhead svg { block-size: 20px; inline-size: auto; }
.mail h3 { margin: 4px 0 8px; } .mail p { margin: 4px 0; overflow-wrap: anywhere; }
.mbtn { display: inline-flex; padding: 8px 16px; border-radius: 10px; background: var(--brand-primary); color: var(--on-brand) !important; font-weight: 600; }
.mfoot { margin-block-start: 12px; padding-block-start: 8px; border-block-start: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: var(--text-12); }
.smsbubble { max-inline-size: 320px; padding: 10px 14px; border-radius: 16px; background: var(--bg-subtle); }
.smsbubble p { margin: 0; overflow-wrap: anywhere; } .smsbubble .note { margin-block-start: 6px; }
.mlist2 { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mlist2 li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.mlist2 li > div { display: grid; min-inline-size: 0; } .mlist2 .muted { font-size: var(--text-12); overflow-wrap: anywhere; }
.askbox { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-block: 12px; min-inline-size: 0; }
.askbox .cmd-input, .askbox input { min-inline-size: 0; }   /* the Ask box shrinks to narrow device panels (the scanner, a watch) instead of spilling */
.askbox input { inline-size: 100%; }
.asres { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.asres li { padding: 10px; border-radius: 12px; background: var(--bg-subtle); } .asres p { margin: 4px 0 0; overflow-wrap: anywhere; }
.confirmcard, .asreceipt { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--border-subtle); background: var(--bg-surface); }
.asreceipt { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-color: var(--status-success-border); background: var(--status-success-bg); color: var(--status-success-text); }
.asreceipt .link { color: var(--status-success-text); text-decoration: underline; }   /* the links take the receipt's own readable colour in light and dark */
.aswhat { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.suggested { margin: 0; color: var(--text-secondary); font-size: var(--text-12); }
.fixthis { margin-block-start: 8px; }
.crumbs { font-size: var(--text-14); margin-block-end: 8px; }
.crumbs ol { display: flex; flex-wrap: wrap; gap: 4px; margin: 0; padding: 0; list-style: none; }
.crumbs li { display: inline-flex; align-items: center; gap: 4px; min-inline-size: 0; }
.crumbs li + li::before { content: "/"; color: var(--text-secondary); }
.crumbs a { display: inline-flex; align-items: center; min-block-size: var(--touch-target); overflow-wrap: anywhere; }

/* MASTER UPDATE section 3 on every Business app device: the bell button and its badge, banners on the device screen, the

   right-to-left works; every control is at least the 44 px target. */
.dsh-bell { position: relative; }
.dsh-badge { position: absolute; inset-block-start: 2px; inset-inline-end: 2px; min-inline-size: 18px; block-size: 18px; padding: 0 4px; border-radius: 999px; background: var(--status-danger-text); color: var(--on-brand); font: 700 11px/18px var(--font-body); text-align: center; }

:is(.dsh-panel, .notifications) .primary, .dk-banners .primary, .dk-sheet .primary { padding: 0 14px; border: 0; background: var(--brand-primary); color: var(--on-brand); }

:is(.dsh-panel, .notifications) .mitem { display: inline-flex; align-items: center; gap: 8px; min-block-size: var(--touch-target); color: var(--brand-ink); }
:is(.dsh-panel, .notifications) :is(.note, .muted) { color: var(--text-secondary); font-size: 12px; }
.dsh-panel .cmd-input { display: flex; align-items: center; gap: 8px; min-block-size: var(--touch-target); padding: 0 10px; border: 1px solid var(--border-input); border-radius: 10px; }

   long words wrap and never widen the screen. */
.emk { display: grid; place-items: center; min-block-size: 100%; padding: 16px; box-sizing: border-box; background: var(--bg-subtle); color: var(--text-primary); }
.emk-card { display: grid; gap: 10px; inline-size: min(100%, 30rem); padding: 18px; border: 1px solid var(--border-subtle); border-radius: 16px; background: var(--bg-surface); box-sizing: border-box; }

.emk-card p, .emk-sheet p { margin: 0; overflow-wrap: anywhere; }
.emk-ic { display: inline-grid; place-items: center; inline-size: 40px; block-size: 40px; border-radius: 999px; background: var(--brand-subtle); color: var(--brand-ink); }
.emk-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.emk-row > * { min-inline-size: 0; }
.emk-btn { min-block-size: var(--touch-target); min-inline-size: var(--touch-target); padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--bg-surface); color: var(--text-primary); font: 600 15px var(--font-body); overflow-wrap: anywhere; cursor: pointer; }
.emk-btn.primary { border-color: var(--brand-primary); background: var(--brand-primary); color: var(--on-brand); }
.emk-btn[aria-pressed="true"] { border-color: var(--brand-primary); background: var(--brand-subtle); color: var(--brand-ink); }
.emk-btn:disabled { opacity: .55; cursor: not-allowed; }
.emk-btn:focus-visible, .emk-toggle:focus-visible, .emk-choice:focus-visible { outline: 3px solid var(--brand-primary); outline-offset: 2px; }
.emk-note { color: var(--text-secondary); font-size: 13px; }
.emk-state { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.emk-practice { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; padding: 6px 12px; border-block-end: 1px solid var(--status-warning-border); background: var(--status-warning-bg); color: var(--status-warning-text); font-size: 13px; }
.emk-home { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px; padding: 8px 12px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-surface); color: var(--text-primary); font-size: 13px; }
.emk-home p { flex: 1 1 12rem; margin: 0; overflow-wrap: anywhere; }
.emk-sheet { position: absolute; inset-inline: 8px; inset-block-end: 8px; z-index: 20; display: grid; gap: 10px; max-block-size: calc(100% - 16px); overflow: auto; padding: 14px; border: 1px solid var(--border-strong); border-radius: 14px; background: var(--bg-surface); color: var(--text-primary); box-sizing: border-box; }
.emk-sheet h2 { margin: 0; font: 700 17px/1.3 var(--font-heading); overflow-wrap: anywhere; }
.emk-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.emk-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; inline-size: 100%; min-block-size: var(--touch-target); padding: 0 12px; border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--bg-surface); color: var(--text-primary); font: inherit; text-align: start; }
.emk-toggle span { min-inline-size: 0; overflow-wrap: anywhere; }
.emk-toggle[aria-pressed="true"] strong { color: var(--status-success-text); }
.emk-choices { display: flex; flex-wrap: wrap; gap: 6px; }
.emk-choice { display: grid; gap: 2px; min-block-size: var(--touch-target); padding: 6px 12px; border: 1px solid var(--border-subtle); border-radius: 10px; background: var(--bg-surface); color: var(--text-primary); font: inherit; text-align: start; overflow-wrap: anywhere; }
.emk-choice[aria-pressed="true"] { border-color: var(--brand-primary); background: var(--brand-subtle); }
.emk-choice span { color: var(--text-secondary); font-size: 12px; }
.emk-ways { margin: 0; padding-inline-start: 1.25rem; display: grid; gap: 4px; }
.emk-art { position: absolute; inset-block: 0; display: grid; place-items: center; pointer-events: none; opacity: .9; }
.emk-art svg { max-inline-size: 100%; max-block-size: 100%; }
/* zero weight (:where), so a device that pins its app to the screen (counter tablet: .screen .app absolute) keeps it; a regression found by the owner on 19 November 2026 */
:where(#screen, #display, #app, .app) { position: relative; }
/* the panel in the Business app */
.emp-path { margin: 0; }
.emp-filter, .emp-guided, .emp-actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.emp-offer { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; padding: 10px; border: 1px solid var(--border-subtle); border-radius: 12px; background: var(--bg-subtle); }
.emp-offer > div { flex: 1 1 12rem; min-inline-size: 0; overflow-wrap: anywhere; }
.emp-list, .emp-ems, .emp-why { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.emp-dev { display: grid; gap: 6px; padding: 8px 0; border-block-end: 1px solid var(--border-subtle); }
.emp-dev.warn > .rowbtn .sub { color: var(--status-warning-text); }
.emp-em { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-inline-start: 12px; overflow-wrap: anywhere; }
.emp-why li { padding-inline-start: 12px; color: var(--status-warning-text); font-size: 13px; }
.emp-tones { display: grid; gap: 6px; inline-size: 100%; }
.emp-usage .rowbtn > button, .emp-actions > button { flex: 0 1 auto; }

/* LynkStock scanner: an original rugged handheld with a trigger. Every colour is a design token. */
.gun { width: 300px; position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 18px; }
.window { width: 120px; height: 14px; border-radius: 7px 7px 0 0; background: var(--device-glass); transition: box-shadow .1s; }
.window.on { box-shadow: 0 -10px 24px var(--device-key-cancel); }
.gbody { width: 300px; padding: 18px 16px 20px; border-radius: 26px 26px 34px 34px; background: linear-gradient(160deg, var(--device-key-clear), var(--device-shell) 22%, var(--device-glass)); box-shadow: 0 24px 50px -20px color-mix(in srgb, var(--device-glass) 60%, transparent); }
.sscreen { height: 360px; border-radius: 10px; background: var(--bg-base); color: var(--text-primary); overflow: hidden; display: flex; flex-direction: column; font: 13px var(--font-body); }
.sscreen.dark { color-scheme: dark; }
.shead { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; background: var(--bg-surface); border-bottom: 1px solid var(--border-subtle); font-weight: 700; }
.shead .off { color: var(--status-warning-text); }
.ic { display: inline-block; width: 14px; height: 14px; vertical-align: middle; }
.ic svg { width: 100%; height: 100%; display: block; }
.smodes { display: flex; border-bottom: 1px solid var(--border-subtle); }
.smodes button { flex: 1; min-height: 32px; border: 0; background: transparent; color: var(--text-secondary); font: 600 11px var(--font-body); cursor: pointer; overflow-wrap: anywhere; }
.smodes button[aria-current] { color: var(--brand-ink); box-shadow: inset 0 -2px 0 var(--brand-primary); }
.sbody { flex: 1; overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.sbody h2 { margin: 0; font-size: 16px; }
.sbody p { margin: 0; }
.big .ic { width: 48px; height: 48px; display: block; margin: 8px auto 0; color: var(--text-secondary); }
.sbody > p:nth-child(2) { text-align: center; color: var(--text-secondary); }
.ok { text-align: center; color: var(--status-success-text); font-weight: 600; }
.code { font-family: var(--font-mono); color: var(--text-secondary); }
em { font-style: normal; font-weight: 700; color: var(--status-warning-text); }
.slist { list-style: none; margin: 4px 0 0; padding: 0; }
.slist li { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--border-subtle); }
.slist li span:first-child { flex: 1; overflow-wrap: anywhere; }
.slist em { width: 100%; font-size: 11px; }
.qty { display: flex; align-items: center; justify-content: center; gap: 18px; margin: 8px 0; }
.qty button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; padding: 12px; }
.qty output { font: 700 28px var(--font-heading); min-width: 50px; text-align: center; }
.save { min-height: 44px; border: 0; border-radius: 10px; background: var(--brand-primary); color: var(--on-brand); font: 700 14px var(--font-body); cursor: pointer; }
.skeys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
.skeys button { height: 40px; border: 0; border-radius: 10px; background: var(--device-key); color: var(--on-device-key); font: 700 13px var(--font-body); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.skeys button:last-child { background: var(--device-key-enter); color: var(--on-device-key-enter); }
.skeys .ic { width: 18px; height: 18px; }
.trigger { margin-top: -8px; width: 110px; height: 120px; border: 0; border-radius: 0 0 40px 40px; background: linear-gradient(180deg, var(--device-shell), var(--device-glass)); color: var(--device-key-clear); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.trigger .ic { width: 36px; height: 36px; }
.gun > .mark { position: absolute; bottom: 20px; width: 14px; color: var(--on-device-key); opacity: .6; }
.mark svg { width: 100%; height: auto; display: block; }
.shead { flex-wrap: wrap; gap: 4px; }
/* script cover */
:is([lang|="ar"], [lang|="fa"], [lang|="ur"], [lang|="ps"], [lang|="ckb"], [lang|="sd"], [lang|="ug"], [lang|="hi"], [lang|="bn"], [lang|="ta"], [lang|="th"]) :is(h1, h2, h3, h4, h5, h6, .font-heading, .badge-label, .micro-chip, .nbig, .ticket .tnum, .ph-code strong, .rtk, .qpaper .qp-num, .qs-num, .qcd-num) { letter-spacing: 0 !important; text-transform: none !important; }
:is([lang|="zh-Hans"], [lang|="zh-Hant"], [lang|="ja"], [lang|="ko"]) :is(h1, h2, h3, h4, h5, h6, .font-heading, .badge-label, .micro-chip, .nbig, .ticket .tnum, .ph-code strong, .rtk, .qpaper .qp-num, .qs-num, .qcd-num) { letter-spacing: 0 !important; text-spacing-trim: space-all; }
</style>

    if (k === "mode")
        S.mode = ["count", "receive", "adjust"].find((m) => m === v) ?? "count";
    if (k === "key") {
        if (v === "enter") {
            save();
            return;
        }
        S.mode = v === "f2" ? "receive" : v === "f3" ? "adjust" : "count";
    }
    if (k === "minus")
        S.qty = Math.max(0, S.qty - 1);
    if (k === "plus")
        S.qty += 1;
    if (k === "save") {
        save();
        return;
    }
    draw();
}
function panel() {
    $("#panel").innerHTML = panelHtml(["online", "country", "dark", "lang"], S, W, C) + DEV.control();
    $("#log").innerHTML = LOG.html(esc, chip, t("no_events"));
    stateButtons($("#stateButtons"), ["list", "count", "receive", "adjust"], (k) => { if (k === "list")
        S.cur = "";
    else {
        S.mode = k;
        S.cur = ITEMS[3].id;
        S.qty = 1;
    } draw(); });
}
function main() {
    S.country = DATA.packOrder[0] ?? "";
    panel();
    draw();
    document.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (!b)
        return; if (DEV.act(b.dataset["act"] ?? ""))
        return; if (b.classList.contains("dsh-scrim") && e.target.closest("[data-stop]"))
        return; if (!DSH.act(b.dataset["act"] ?? ""))
        act(b.dataset["act"] ?? ""); });
    document.addEventListener("input", (e) => { DSH.input(e.target); });
    document.addEventListener("keydown", (e) => { if (DSH.key(e))
        return; DEV.key(e); });
    window.__settle = () => { DSH.settle(); draw(); };
    $("#trigger").addEventListener("click", scan);
    $("#panel").addEventListener("change", (e) => { if (DEV.change(e.target))
        return; if (panelChange(e.target, S, DATA))
        panel(); draw(); });
    window.setInterval(() => { S.ticks += 1; LOG.tick(S.online, false, S.ticks, () => undefined); }, 400);
    fitToWidth($("#rig"), Number($("#rig").dataset["width"]) || 420);
}
main();

})();
document.documentElement.dataset.ready = "1"; window.__readyAt = performance.now();
})();</script>
