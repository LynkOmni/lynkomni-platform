<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t-diagram-sync-states" focusable="false"><title id="t-diagram-sync-states">Diagram of a sale moving from this device, optionally through a nearby relay, to the cloud and then the payment provider, with the five states Queued, Sent, Accepted, Confirmed and Failed, each with an icon, a label and a short meaning.</title><rect x="0" y="0" width="760" height="330" rx="0" fill="#09090B" stroke="none"/><text x="24" y="34" fill="#FAFAFA" font-size="20" font-weight="700" text-anchor="start" font-family="'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">How a sale moves, and what each state means</text><rect x="22" y="64" width="132" height="64" rx="12" fill="#18181B" stroke="#FAFAFA" stroke-width="2.5"/><text x="88" y="101" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">This device</text><path d="M156 96H166" fill="none" stroke="#FAFAFA" stroke-width="2.5"/><path d="M160 90l6 6 -6 6" fill="none" stroke="#FAFAFA" stroke-width="2.5"/><rect x="168" y="64" width="132" height="64" rx="12" fill="#18181B" stroke="#FAFAFA" stroke-width="2.5" stroke-dasharray="5 5"/><text x="234" y="93" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Nearby relay</text><text x="234" y="112" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">(optional)</text><path d="M302 96H312" fill="none" stroke="#FAFAFA" stroke-width="2.5"/><path d="M306 90l6 6 -6 6" fill="none" stroke="#FAFAFA" stroke-width="2.5"/><rect x="314" y="64" width="132" height="64" rx="12" fill="#18181B" stroke="#FAFAFA" stroke-width="2.5"/><text x="380" y="101" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Cloud</text><path d="M448 96H458" fill="none" stroke="#FAFAFA" stroke-width="2.5"/><path d="M452 90l6 6 -6 6" fill="none" stroke="#FAFAFA" stroke-width="2.5"/><rect x="460" y="64" width="132" height="64" rx="12" fill="#18181B" stroke="#FAFAFA" stroke-width="2.5"/><text x="526" y="101" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Payment provider</text><rect x="606" y="64" width="132" height="64" rx="12" fill="#18181B" stroke="#FAFAFA" stroke-width="2.5" stroke-dasharray="5 5"/><text x="672" y="101" fill="#FAFAFA" font-size="14" font-weight="600" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Any step</text><path d="M88 128V170" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="22" y="170" width="132" height="52" rx="10" fill="#27272A" stroke="#FAFAFA" stroke-width="2"/><g transform="translate(34 184)" color="#FAFAFA" stroke="#FAFAFA" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M12 7v5l3 2"/></g><text x="66" y="201" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Queued</text><path d="M234 128V170" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="168" y="170" width="132" height="52" rx="10" fill="#1F1047" stroke="#FAFAFA" stroke-width="2"/><g transform="translate(180 184)" color="#FAFAFA" stroke="#FAFAFA" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V5M6 11l6-6 6 6M5 21h14"/></g><text x="212" y="201" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Sent</text><path d="M380 128V170" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="314" y="170" width="132" height="52" rx="10" fill="#1F1047" stroke="#FAFAFA" stroke-width="2"/><g transform="translate(326 184)" color="#FAFAFA" stroke="#FAFAFA" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></g><text x="358" y="201" fill="#FAFAFA" font-size="15" font-weight="600" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Accepted</text><path d="M526 128V170" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="460" y="170" width="132" height="52" rx="10" fill="#064E3B" stroke="#34D399" stroke-width="2"/><g transform="translate(472 184)" color="#34D399" stroke="#34D399" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M8 12.5l3 3 5-6"/></g><text x="504" y="201" fill="#34D399" font-size="15" font-weight="600" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Confirmed</text><path d="M672 128V170" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="3 4"/><rect x="606" y="170" width="132" height="52" rx="10" fill="#450A0A" stroke="#FCA5A5" stroke-width="2"/><g transform="translate(618 184)" color="#FCA5A5" stroke="#FCA5A5" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0M9 9l6 6M15 9l-6 6"/></g><text x="650" y="201" fill="#FCA5A5" font-size="15" font-weight="600" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Failed</text><text x="26" y="246" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Saved on this</text><text x="26" y="262" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">device, not sent</text><text x="26" y="278" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">yet.</text><text x="172" y="246" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">Left this device,</text><text x="172" y="262" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">awaiting the cloud.</text><text x="318" y="246" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">The cloud stored</text><text x="318" y="262" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">it. No money</text><text x="318" y="278" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">confirmed.</text><text x="464" y="246" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">The provider</text><text x="464" y="262" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">confirmed it.</text><text x="610" y="246" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">It did not go</text><text x="610" y="262" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">through.</text><text x="24" y="322" fill="#A1A1AA" font-size="12" font-weight="400" text-anchor="start" font-family="'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif" stroke="none">A relayed sale stays “sent” until the cloud accepts it. LynkOmni never holds the money.</text></svg>